<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ADRH Mapper · Coruña Labs</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  /* ===== Coruña Labs shared design tokens — extracted from Bus Works ===== */
  :root{
    --ink:#16181a;--muted:#6b7177;--faint:#9aa0a6;--hairline:#e2e3e5;
    --paper:#fbfbfa;--panel:#ffffff;--rest:#b4b8bc;
    --error:#a50813;
    --accent:#1B4965; /* Atlantic blue — ramp anchor for this tool */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;color:var(--ink);
    background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
  #map{position:absolute;inset:0}
  /* MapLibre sets grab/grabbing on the canvas by default; this tool keeps the
     plain arrow throughout — the hover outline is the only affordance. */
  #map .maplibregl-canvas-container,
  #map .maplibregl-canvas-container.maplibregl-interactive,
  #map .maplibregl-canvas-container.maplibregl-interactive:active,
  #map canvas{cursor:default !important}

  /* ---------- Masthead: gradient bleed, flush top-left, no card/shadow ---------- */
  .masthead{position:absolute;top:0;left:0;z-index:5;padding:20px 22px 26px;max-width:380px;
    background:linear-gradient(180deg,rgba(251,251,250,.94),rgba(251,251,250,0))}
  .masthead .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;pointer-events:none}
  .lab{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 7px;display:flex;align-items:center;gap:7px}
  .lab a{color:inherit;text-decoration:none;pointer-events:auto}
  .lab a:hover{color:var(--ink)}
  .masthead h1{font-size:23px;line-height:1.12;margin:0;font-weight:660;letter-spacing:-.015em}
  .masthead p.sub{font-size:12.5px;line-height:1.5;color:var(--muted);margin:9px 0 0;max-width:320px;pointer-events:none}
  .masthead p.note{font-size:11.5px;color:var(--faint);margin:7px 0 0;font-style:italic}

  .langs{pointer-events:auto;display:flex;gap:2px;flex:0 0 auto;margin-top:2px}
  .langs button{background:none;border:none;font:inherit;font-size:11px;font-weight:600;
    letter-spacing:.04em;color:var(--faint);cursor:pointer;padding:3px 6px;border-radius:5px;
    text-transform:uppercase}
  .langs button:hover{color:var(--muted);background:rgba(0,0,0,.04)}
  .langs button.on{color:var(--ink);background:rgba(0,0,0,.06)}

  /* ---------- Rail: indicator picker ----------
     Divergence from the shared 200px rail: widened to 240px so each variable's
     plain-language gloss fits on two lines instead of wrapping to three. */
  .rail{position:absolute;z-index:5;right:14px;top:14px;bottom:14px;width:240px;background:var(--panel);
    border:1px solid var(--hairline);border-radius:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 10px 30px rgba(0,0,0,.07);
    display:flex;flex-direction:column;overflow:hidden}
  .rail h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin:0;padding:14px 16px 11px;border-bottom:1px solid var(--hairline);font-weight:600}
  .rail .scroll{overflow-y:auto;padding:7px;flex:1}
  .ghead{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    font-weight:600;padding:11px 9px 4px}
  .ghead:first-child{padding-top:5px}
  .chip{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;
    user-select:none;transition:background .12s}
  .chip:hover{background:#f4f5f6}
  .chip.active{background:#f0f1f2;box-shadow:inset 2px 0 0 var(--accent)}
  .vtxt{min-width:0}
  .vname{display:block;font-size:12px;font-weight:550;color:var(--muted);line-height:1.3}
  .chip.active .vname{color:var(--ink)}
  .vgloss{display:block;font-size:10.5px;color:var(--faint);line-height:1.35;margin-top:1px}

  /* legend lives inside the rail, between list and foot */
  .legend{border-top:1px solid var(--hairline);padding:11px 16px 10px}
  .lg-ramp{display:flex;height:9px;border-radius:4px;overflow:hidden;margin-bottom:4px}
  .lg-ramp span{flex:1}
  .lg-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .lg-mid{font-size:10px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
  .lg-mid::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;
    background:#eef0f0;border:1px solid var(--hairline);margin-right:5px;vertical-align:middle}
  .lg-nodata{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);margin-top:6px}
  .lg-nodata i{width:11px;height:11px;border-radius:3px;background:#dadcde;flex:0 0 auto}

  .rail .foot{border-top:1px solid var(--hairline);padding:10px 16px;font-size:10px;
    color:var(--faint);line-height:1.5}
  .rail .foot a{color:var(--faint);text-decoration:underline;text-underline-offset:2px}

  /* ---------- Callout: detail slot inside the rail ---------- */
  /* Desktop: lives at the bottom of the rail. Collapsed to 0 height at rest,
     expands when a section is selected (.rail.has-detail). Pushes the indicator
     list up rather than covering the map. */
  .detail{border-top:1px solid var(--hairline);background:var(--panel);
    max-height:0;overflow:hidden;transition:max-height .28s ease;flex:0 0 auto}
  .rail.has-detail .detail{max-height:340px;overflow-y:auto}
  .rail.has-detail .scroll{flex:1 1 auto}
  .detail__inner{padding:15px 16px 16px;position:relative}
  .detail__close{position:absolute;top:8px;right:8px;background:none;border:none;font-size:1.1rem;
    line-height:1;color:var(--faint);cursor:pointer;padding:4px 7px}
  .detail__close:hover{color:var(--ink)}
  /* Back button: mobile-only (flip view). Hidden on desktop, where the × serves. */
  .detail__back{display:none;align-items:center;gap:6px;background:none;border:none;font:inherit;
    font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);cursor:pointer;
    padding:2px 0 12px;text-transform:uppercase}
  .detail__back:hover{color:var(--ink)}
  .detail__back svg{width:13px;height:13px}
  /* Mobile: the rail strip flips fully to the detail — chip list + legend hide,
     detail takes over with a back arrow to return. One surface, no floating sheet. */
  @media (max-width:640px){
    .detail{border-top:none;max-height:0;overflow:hidden}
    .rail.has-detail .detail{max-height:none;overflow-y:auto;flex:1 1 auto}
    .rail.has-detail .scroll,
    .rail.has-detail .legend,
    .rail.has-detail h2{display:none}
    .detail__close{display:none}          /* mobile uses the back button */
    .detail__back{display:inline-flex}
  }
  .panel__title{margin:0 30px 3px 0;font-size:15px;font-weight:660;color:var(--ink)}
  .panel__subtitle{margin:0 0 14px;font-size:11.5px;color:var(--muted);font-weight:600}
  .panel__field{margin-bottom:11px}
  .panel__field-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--faint);margin:0 0 2px}
  .panel__field-value{font-size:12.5px;margin:0;color:var(--ink)}
  .panel__field-value.big{font-size:24px;font-weight:660;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .panel__note{margin-top:16px;padding-top:12px;border-top:1px solid var(--hairline);
    font-size:11px;color:var(--faint);line-height:1.45}

  /* ---------- Toast: centered loading/error state ---------- */
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;
    background:var(--panel);border:1px solid var(--hairline);border-radius:9px;padding:14px 18px;
    font-size:13px;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .toast.err{color:var(--error)}

  @media (max-width:640px){
    .masthead{max-width:none;width:100%}
    .masthead p.sub{display:none} /* subtitle too tight on phones — title carries it */
    .rail{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:42%}
    .rail.has-detail{max-height:70%} /* flipped-to-detail view gets more room */
    .maplibregl-ctrl-bottom-left{display:none} /* zoom buttons: desktop only */
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<div class="masthead">
  <div class="top">
    <div>
      <p class="lab"><a href="https://corunalabs.org" target="_blank" rel="noopener">Coruña Labs</a></p>
      <h1 id="m-title">ADRH Mapper</h1>
    </div>
    <div class="langs" id="langs">
      <button data-lang="gl">GL</button><button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </div>
  <p class="sub" id="m-sub"></p>
  <p class="sub note" id="m-note"></p>
</div>

<div class="rail" aria-label="Indicadores">
  <h2 id="r-title"></h2>
  <div class="scroll" id="chips"></div>
  <div class="legend" id="legend"></div>
  <div class="detail" id="detail" aria-live="polite">
    <div class="detail__inner" id="detail-inner"></div>
  </div>
  <div class="foot" id="r-foot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   ADRH Mapper — Coruña Labs
   Built on the shared map tool core (extracted from Bus Works).

   Data: INE, Atlas de Distribución de Renta de los Hogares, 2023, by
   sección censal. Expects data/adrh_cusec_2023.geojson — one feature per
   section, CUSEC property plus one numeric property per indicator (null
   where INE suppressed the value). See repo README for the R export step.

   Color convention: red always marks the "worse" end (high poverty, high
   inequality), set per variable via the badHigh flag. Income and inequality
   use median-anchored diverging ramps; everything else is sequential.

   Callout: a detail slot inside the rail. Desktop expands it below the
   indicator list (both visible); mobile flips the rail fully to the detail
   with a back arrow. One markup template, switched by the .has-detail class
   plus the mobile breakpoint — a candidate pattern for the shared template.
   ========================================================================== */

/* ---------- TOOL-SPECIFIC: tunable levers ---------- */
const DATA_URL     = "data/adrh_cusec_2023.geojson";
const FILL_OPACITY = 0.72;                       // choropleth transparency (0-1)
const BORDER       = { color:"#ffffff", width:0.8, opacity:0.85 }; // soft edges, no geometry distortion
const HIGHLIGHT    = { color:"#16181a", width:2 };
const HOVER        = { color:"#7c848b", width:2.6, opacity:0.3 }; // thicker but soft — a hint, not a click
const NODATA       = { color:"#dadcde", opacity:0.35 };            // suppressed sections
const N_CLASSES    = 5;                          // quantile classes
const RAMP = ["#e9f0f4","#c3d5e0","#8fb0c2","#54809c","#1B4965"]; // sequential: light → Atlantic blue
const RAMP_BAD = ["#f6e7e3","#e7b3a6","#d2795f","#b8442f","#8f1d15"]; // sequential: light → deep red, for "more = worse"
/* Diverging ramps, anchored at the A Coruña median (computed client-side, so
   the midpoint means "the city norm"). Two directions because "high" isn't
   universally good:
   - RAMP_DIV_GOOD: low = warm clay, high = Atlantic blue. For income, where
     more is better.
   - RAMP_DIV_BAD: low = blue (calm), high = strong red. For Gini / P80-P20,
     where high inequality is the thing to flag.
   Both warm/cool, colorblind-distinguishable. */
const RAMP_DIV_GOOD = ["#a8532f","#d59968","#8bb0c4","#3f7799","#1B4965"];
const RAMP_DIV_BAD  = ["#1B4965","#5a8299","#c98a72","#c0503a","#a5251d"];
const DEFAULT_VAR  = "income_mean_household";

/* ---------- TOOL-SPECIFIC: indicators ----------
   Each entry drives one toggle + one choropleth layer. Fields:
     key       property name in the GeoJSON (also the ?v= URL value)
     group     which rail section it sits under (see GROUPS)
     unit      eur | pct | num — controls number formatting
     diverging (optional) true → ramp is anchored at the A Coruña median,
               so color reads "above / below the city norm" (income, Gini)
     badHigh   (optional) true → high values are the "bad" end, shown in red.
               Works for both diverging (flips to RAMP_DIV_BAD) and sequential
               (uses RAMP_BAD) variables, so red always means "worse".
     name/gloss  trilingual label + one-line plain-language description */
const GROUPS = {
  renda:   {gl:"Renda",              es:"Renta",               en:"Income"},
  pobreza: {gl:"Pobreza e limiares", es:"Pobreza y umbrales",  en:"Poverty & thresholds"},
  desig:   {gl:"Desigualdade",       es:"Desigualdad",         en:"Inequality"},
  demo:    {gl:"Demografía",         es:"Demografía",          en:"Demographics"},
  fontes:  {gl:"Fontes de ingresos", es:"Fuentes de ingresos", en:"Income sources"},
};

const VARS = [
  { key:"income_mean_household", group:"renda", unit:"eur", diverging:true,
    name:{gl:"Renda neta media por fogar", es:"Renta neta media por hogar", en:"Mean net household income"},
    gloss:{gl:"Ingresos anuais medios dun fogar, despois de impostos.",
           es:"Ingresos anuales medios de un hogar, después de impuestos.",
           en:"Average yearly income per household, after tax."} },
  { key:"income_mean_person", group:"renda", unit:"eur", diverging:true,
    name:{gl:"Renda neta media por persoa", es:"Renta neta media por persona", en:"Mean net income per person"},
    gloss:{gl:"Ingresos anuais medios por residente, despois de impostos.",
           es:"Ingresos anuales medios por residente, después de impuestos.",
           en:"Average yearly income per resident, after tax."} },

  { key:"poverty_fixed_7500eur", group:"pobreza", unit:"pct", badHigh:true,
    name:{gl:"Poboación con menos de 7.500 €", es:"Población con menos de 7.500 €", en:"Population under €7,500"},
    gloss:{gl:"Porcentaxe que vive con menos de 7.500 € ao ano, axustado polo tamaño do fogar.",
           es:"Porcentaje que vive con menos de 7.500 € al año, ajustado por el tamaño del hogar.",
           en:"Share living on under €7,500 a year, adjusted for household size."} },
  { key:"poverty_relative_below60pct", group:"pobreza", unit:"pct", badHigh:true,
    name:{gl:"Baixo o 60 % da mediana", es:"Bajo el 60 % de la mediana", en:"Below 60% of median"},
    gloss:{gl:"Taxa de risco de pobreza: ingresos por baixo do 60 % da mediana nacional.",
           es:"Tasa de riesgo de pobreza: ingresos por debajo del 60 % de la mediana nacional.",
           en:"At-risk-of-poverty rate: income below 60% of the national median."} },
  { key:"affluence_relative_above200pct", group:"pobreza", unit:"pct",
    name:{gl:"Sobre o 200 % da mediana", es:"Sobre el 200 % de la mediana", en:"Above 200% of median"},
    gloss:{gl:"Porcentaxe con ingresos que dobran a mediana nacional.",
           es:"Porcentaje con ingresos que doblan la mediana nacional.",
           en:"Share with income more than double the national median."} },
  { key:"child_poverty_relative_below60pct", group:"pobreza", unit:"pct", badHigh:true,
    name:{gl:"Menores en risco de pobreza", es:"Menores en riesgo de pobreza", en:"Children at risk of poverty"},
    gloss:{gl:"Menores de 18 baixo o 60 % da mediana. O INE só o publica nunhas poucas seccións.",
           es:"Menores de 18 bajo el 60 % de la mediana. El INE solo lo publica en unas pocas secciones.",
           en:"Under-18s below 60% of median income. INE publishes it for only a few sections."} },

  { key:"gini_index", group:"desig", unit:"num", diverging:true, badHigh:true,
    name:{gl:"Índice de Gini", es:"Índice de Gini", en:"Gini index"},
    gloss:{gl:"Desigualdade de ingresos dentro da sección: 0 = igualdade total, 100 = máxima.",
           es:"Desigualdad de ingresos dentro de la sección: 0 = igualdad total, 100 = máxima.",
           en:"Income inequality within the section: 0 = total equality, 100 = maximum."} },
  { key:"p80p20_ratio", group:"desig", unit:"num", diverging:true, badHigh:true,
    name:{gl:"Ratio P80/P20", es:"Ratio P80/P20", en:"P80/P20 ratio"},
    gloss:{gl:"Cantas veces superan os ingresos do 20 % máis alto os do 20 % máis baixo.",
           es:"Cuántas veces superan los ingresos del 20 % más alto a los del 20 % más bajo.",
           en:"How many times the top 20%'s income exceeds the bottom 20%'s."} },

  { key:"pct_under18", group:"demo", unit:"pct",
    name:{gl:"Menores de 18 anos", es:"Menores de 18 años", en:"Under 18"},
    gloss:{gl:"Porcentaxe da poboación con menos de 18 anos.",
           es:"Porcentaje de la población con menos de 18 años.",
           en:"Share of the population under 18."} },
  { key:"pct_over65", group:"demo", unit:"pct",
    name:{gl:"Maiores de 65 anos", es:"Mayores de 65 años", en:"Over 65"},
    gloss:{gl:"Porcentaxe da poboación con 65 anos ou máis.",
           es:"Porcentaje de la población con 65 años o más.",
           en:"Share of the population aged 65 or over."} },

  { key:"income_source_salary", group:"fontes", unit:"pct",
    name:{gl:"Salarios", es:"Salarios", en:"Salaries"},
    gloss:{gl:"Parte da renda bruta que procede de salarios.",
           es:"Parte de la renta bruta que procede de salarios.",
           en:"Share of gross income that comes from wages."} },
  { key:"income_source_pensions", group:"fontes", unit:"pct",
    name:{gl:"Pensións", es:"Pensiones", en:"Pensions"},
    gloss:{gl:"Parte da renda bruta que procede de pensións.",
           es:"Parte de la renta bruta que procede de pensiones.",
           en:"Share of gross income that comes from pensions."} },
  { key:"income_source_unemployment", group:"fontes", unit:"pct",
    name:{gl:"Prestacións por desemprego", es:"Prestaciones por desempleo", en:"Unemployment benefits"},
    gloss:{gl:"Parte da renda que procede de prestacións por desemprego.",
           es:"Parte de la renta que procede de prestaciones por desempleo.",
           en:"Share of income that comes from unemployment benefits."} },
  { key:"income_source_other_benefits", group:"fontes", unit:"pct",
    name:{gl:"Outras prestacións", es:"Otras prestaciones", en:"Other benefits"},
    gloss:{gl:"Parte da renda que procede doutras axudas públicas.",
           es:"Parte de la renta que procede de otras ayudas públicas.",
           en:"Share of income from other public benefits."} },
  { key:"income_source_other_income", group:"fontes", unit:"pct",
    name:{gl:"Outros ingresos", es:"Otros ingresos", en:"Other income"},
    gloss:{gl:"Rendas de capital, alugueiros e outras fontes.",
           es:"Rentas de capital, alquileres y otras fuentes.",
           en:"Capital income, rents and other sources."} },
];

/* ---------- TOOL-SPECIFIC: strings ---------- */
const I18N = {
  gl:{ title:"ADRH Mapper",
       sub:"Renda, pobreza e demografía por sección censal na Coruña.",
       note:"Fai clic nunha sección para ver o dato.",
       loading:"Cargando…", error:"Non se puideron cargar os datos.",
       rail:"Indicadores", nodata:"Sen dato publicado", median:"Mediana da cidade",
       suppressed:"O INE non publica este dato para esta sección (segredo estatístico).",
       district:"Distrito", section:"Sección",
       foot:'Datos: <a href="https://www.ine.es/dyngs/INEbase/operacion.htm?c=Estadistica_C&cid=1254736177088&menu=resultados&idp=1254735976608" target="_blank" rel="noopener">INE, ADRH 2023</a> · Mapa © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a><br><a href="https://github.com/Coruna-Labs/adrh-mapper" target="_blank" rel="noopener">Código fonte ↗</a>',
       source:"Fonte: INE, Atlas de Distribución de Renda dos Fogares, 2023." },
  es:{ title:"ADRH Mapper",
       sub:"Renta, pobreza y demografía por sección censal en A Coruña.",
       note:"Haz clic en una sección para ver el dato.",
       loading:"Cargando…", error:"No se pudieron cargar los datos.",
       rail:"Indicadores", nodata:"Sin dato publicado", median:"Mediana de la ciudad",
       suppressed:"El INE no publica este dato para esta sección (secreto estadístico).",
       district:"Distrito", section:"Sección",
       foot:'Datos: <a href="https://www.ine.es/dyngs/INEbase/operacion.htm?c=Estadistica_C&cid=1254736177088&menu=resultados&idp=1254735976608" target="_blank" rel="noopener">INE, ADRH 2023</a> · Mapa © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a><br><a href="https://github.com/Coruna-Labs/adrh-mapper" target="_blank" rel="noopener">Código fuente ↗</a>',
       source:"Fuente: INE, Atlas de Distribución de Renta de los Hogares, 2023." },
  en:{ title:"ADRH Mapper",
       sub:"Income, poverty and demographics by census section in A Coruña.",
       note:"Click a section to see its value.",
       loading:"Loading…", error:"Couldn't load the data.",
       rail:"Indicators", nodata:"No published value", median:"City median",
       suppressed:"INE does not publish this value for this section (statistical secrecy).",
       district:"District", section:"Section",
       foot:'Data: <a href="https://www.ine.es/dyngs/INEbase/operacion.htm?c=Estadistica_C&cid=1254736177088&menu=resultados&idp=1254735976608" target="_blank" rel="noopener">INE, ADRH 2023</a> · Map © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a><br><a href="https://github.com/Coruna-Labs/adrh-mapper" target="_blank" rel="noopener">Source code ↗</a>',
       source:"Source: INE, Atlas de Distribución de Renta de los Hogares, 2023." },
};
const LANGS = ["gl","es","en"];
const STORAGE_KEY = "adrhmapper.lang";
const LOCALES = { gl:"gl-ES", es:"es-ES", en:"en-GB" };

/* ---------- SHARED: language via ?lang= + localStorage ---------- */
const params = new URLSearchParams(location.search);
function initialLang(){
  const u = params.get("lang");
  if(u && LANGS.includes(u)) return u;
  try{ const s = localStorage.getItem(STORAGE_KEY); if(s && LANGS.includes(s)) return s; }catch(e){}
  return "gl";
}
let lang = initialLang();

/* tool state */
let activeKey = (()=>{ const v = params.get("v"); return VARS.some(x=>x.key===v) ? v : DEFAULT_VAR; })();
let feats = null;            // geojson features once loaded
let selectedCUSEC = null;    // section open in the panel
const statsCache = {};       // per-variable quantile breaks

function syncURL(){
  const p = new URLSearchParams();
  if(lang && lang!=="gl") p.set("lang",lang);
  if(activeKey && activeKey!==DEFAULT_VAR) p.set("v",activeKey);
  const qs = p.toString();
  history.replaceState(null,"", qs ? `?${qs}` : location.pathname);
}

const toast=document.getElementById("toast");
const showToast=(m,e)=>{toast.style.display="block";toast.textContent=m;toast.classList.toggle("err",!!e)};
const hideToast=()=>toast.style.display="none";

/* ---------- helpers ---------- */
const varByKey = k => VARS.find(v=>v.key===k);
function fmtValue(v, unit){
  if(v==null || typeof v!=="number") return null;
  const loc = LOCALES[lang];
  if(unit==="eur") return new Intl.NumberFormat(loc,{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
  if(unit==="pct") return new Intl.NumberFormat(loc,{maximumFractionDigits:1}).format(v)+" %";
  return new Intl.NumberFormat(loc,{maximumFractionDigits:1}).format(v);
}
/* Compute the color classing for one variable, cached per key. Returns
   { min, max, breaks[], colors[], diverging }. Two strategies:
   - diverging vars: breaks by percentile around the median (city-norm anchored)
   - sequential vars: plain quantile breaks
   Ramp choice keys off the variable's diverging/badHigh flags. Suppressed
   (non-numeric) values are excluded here and painted as no-data separately. */
function getStats(key){
  if(statsCache[key]) return statsCache[key];
  const v = varByKey(key);
  const vals = feats.map(f=>f.properties[key]).filter(x=>typeof x==="number").sort((a,b)=>a-b);
  if(!vals.length){ statsCache[key]={min:null,max:null,breaks:[],colors:[NODATA.color],diverging:false}; return statsCache[key]; }
  const min=vals[0], max=vals[vals.length-1];

  if(v && v.diverging){
    // Breaks by percentile within each half (below / above the median), not by
    // fixed fractions of the value range. This is what makes the story legible:
    // the top slice always lands in the strongest color even when values cluster,
    // so high-inequality sections read red rather than washing out to orange.
    // Tune DIV_PCTS to move the thresholds — e.g. raise the last number to make
    // the deepest color rarer, lower it to make it more common.
    const median = vals[Math.floor(vals.length/2)];
    const DIV_PCTS = [0.15, 0.40, 0.60, 0.85]; // where the 4 class edges sit, by rank
    const q = p => vals[Math.min(vals.length-1, Math.floor(p*vals.length))];
    const breaks = DIV_PCTS.map(q).filter((b,i,a)=> b>min && b<max && (i===0||b>a[i-1]));
    const ramp = v.badHigh ? RAMP_DIV_BAD : RAMP_DIV_GOOD;
    const n = breaks.length+1;
    const colors = Array.from({length:n},(_,i)=> ramp[Math.round(i*(ramp.length-1)/Math.max(1,n-1))]);
    statsCache[key]={min,max,median,breaks,colors,diverging:true,n:vals.length};
    return statsCache[key];
  }

  const q = p => vals[Math.min(vals.length-1, Math.floor(p*vals.length))];
  const raw = []; for(let i=1;i<N_CLASSES;i++) raw.push(q(i/N_CLASSES));
  const breaks = [...new Set(raw)].filter(b=>b>min); // dedupe ties so the step expr stays ascending
  const seqRamp = (v && v.badHigh) ? RAMP_BAD : RAMP; // red when more = worse
  const n = breaks.length+1;
  const colors = Array.from({length:n},(_,i)=> seqRamp[Math.round(i*(seqRamp.length-1)/Math.max(1,n-1))]);
  statsCache[key]={min,max,breaks,colors,diverging:false,n:vals.length};
  return statsCache[key];
}
/* Build MapLibre paint expressions from the cached stats. fillExpr uses a
   "step" expression over the break points; both wrap a "case" that paints any
   non-numeric (suppressed) value as no-data. Rebuilt whenever the active
   variable changes. */
function fillExpr(key){
  const s = getStats(key);
  const step = ["step",["get",key], s.colors[0]];
  s.breaks.forEach((b,i)=> step.push(b, s.colors[i+1]));
  return ["case",["!=",["typeof",["get",key]],"number"], NODATA.color,
          s.breaks.length ? step : s.colors[0]];
}
const opacityExpr = key =>
  ["case",["!=",["typeof",["get",key]],"number"], NODATA.opacity, FILL_OPACITY];

/* ---------- SHARED: apply language to the DOM ---------- */
function applyText(){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.getElementById("m-title").textContent = t.title;
  document.getElementById("m-sub").textContent = t.sub;
  document.getElementById("m-note").textContent = t.note || "";
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  if(toast.style.display==="block" && !toast.classList.contains("err")) toast.textContent=t.loading;
  document.getElementById("r-title").textContent = t.rail;
  document.getElementById("r-foot").innerHTML = t.foot;
  renderChips(); renderLegend(); refreshPanel();
}

/* ---------- rail: single-select indicator chips with glosses ---------- */
function renderChips(){
  const box = document.getElementById("chips");
  let html = "", lastGroup = null;
  for(const v of VARS){
    if(v.group!==lastGroup){
      html += `<div class="ghead">${GROUPS[v.group][lang]}</div>`;
      lastGroup = v.group;
    }
    html += `<div class="chip${v.key===activeKey?" active":""}" data-key="${v.key}">
      <div class="vtxt"><span class="vname">${v.name[lang]}</span>
      <span class="vgloss">${v.gloss[lang]}</span></div></div>`;
  }
  box.innerHTML = html;
}
document.getElementById("chips").addEventListener("click",(e)=>{
  const chip = e.target.closest(".chip"); if(!chip) return;
  setVariable(chip.dataset.key);
});
function setVariable(key){
  if(key===activeKey) return;
  activeKey = key;
  if(feats && map.getLayer("sections-fill")){
    map.setPaintProperty("sections-fill","fill-color",fillExpr(key));
    map.setPaintProperty("sections-fill","fill-opacity",opacityExpr(key));
  }
  renderChips(); renderLegend(); refreshPanel(); syncURL();
}

/* ---------- legend ---------- */
function renderLegend(){
  const box = document.getElementById("legend");
  if(!feats){ box.innerHTML=""; return; }
  const v = varByKey(activeKey), s = getStats(activeKey), t = I18N[lang];
  const ramp = s.colors.map(c=>`<span style="background:${c}"></span>`).join("");
  box.innerHTML =
    `<div class="lg-ramp">${ramp}</div>
     <div class="lg-labels"><span>${fmtValue(s.min,v.unit)??"–"}</span><span>${fmtValue(s.max,v.unit)??"–"}</span></div>
     <div class="lg-nodata"><i></i>${t.nodata}</div>`;
}

/* ---------- SHARED: map init ---------- */
const BASEMAP = "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json";
const SERVICE_AREA = { north:43.4898, south:43.2089, east:-8.0937, west:-8.75 };
const MAX_BOUNDS = [[SERVICE_AREA.west,SERVICE_AREA.south],[SERVICE_AREA.east,SERVICE_AREA.north]];

const map = new maplibregl.Map({
  container:"map", style:BASEMAP,
  center:[-8.4056,43.3696], zoom:13, // slightly wider default than Bus Works — a choropleth reads at district scale
  maxBounds:MAX_BOUNDS, minZoom:11.5,
  attributionControl:false, dragRotate:false, pitchWithRotate:false
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-left");
new ResizeObserver(() => map.resize()).observe(document.getElementById("map"));

/* Layer ordering: the choropleth must sit ABOVE the basemap's land and
   building layers (so buildings don't punch through and hide data in dense
   blocks) but BELOW the road network and labels (so streets stay legible over
   the polygons — the two-deck effect a paid Mapbox basemap used to give,
   free here via CARTO's vector style). So we return the id of the FIRST road
   layer: inserting before it puts data on top of everything earlier
   (land/water/buildings) and under everything later (roads/labels).
   Logs the road and building layer ids so the targeting can be verified
   against the real Positron style rather than assumed. */
function roadsBeforeId(){
  const layers = map.getStyle().layers || [];
  const isRoad  = l => /road|street|highway|tunnel|bridge|transport/i.test(l.id) && l.type==="line";
  const isBldg  = l => /building/i.test(l.id);
  const road = layers.find(isRoad);
  console.log("[ADRH] road layers:", layers.filter(isRoad).map(l=>l.id));
  console.log("[ADRH] building layers:", layers.filter(isBldg).map(l=>l.id));
  if(road) return road.id;
  const sym = layers.find(l=>l.type==="symbol"); // fallback: at least stay under labels
  return sym ? sym.id : undefined;
}

/* ---------- TOOL-SPECIFIC: data + layers ---------- */
map.on("load", async () => {
  try{
    // Positron draws its building fills (ids "building" / "building-top") AFTER
    // roads, so no beforeId can keep them under the choropleth. Since this tool
    // doesn't want buildings at all — they hide data in dense blocks — hide them
    // outright. Guarded in case CARTO renames them in a future style version.
    ["building","building-top"].forEach(id=>{
      if(map.getLayer(id)) map.setLayoutProperty(id,"visibility","none");
    });

    const data = await fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error("data");return r.json()});
    // Drop district/municipal rollup polygons (CUSEC ending in 000) — they overlap
    // the real sections and would otherwise intercept clicks and render on top.
    data.features = data.features.filter(f=>!/000$/.test(f.properties.CUSEC));
    feats = data.features;
    const beforeId = roadsBeforeId();

    map.addSource("sections",{type:"geojson",data,generateId:true}); // generateId enables feature-state hover
    map.addLayer({ id:"sections-fill", type:"fill", source:"sections",
      paint:{ "fill-color":fillExpr(activeKey), "fill-opacity":opacityExpr(activeKey) } }, beforeId);
    map.addLayer({ id:"sections-line", type:"line", source:"sections",
      paint:{ "line-color":BORDER.color, "line-width":BORDER.width, "line-opacity":BORDER.opacity } }, beforeId);
    map.addLayer({ id:"sections-hover", type:"line", source:"sections",
      paint:{ "line-color":HOVER.color, "line-width":HOVER.width,
              // feature-state drives opacity, so moving between polygons fades
              // rather than snapping — a filter swap would be instant.
              "line-opacity":["case",["boolean",["feature-state","hover"],false], HOVER.opacity, 0],
              "line-opacity-transition":{duration:260, delay:0} } });
    map.addLayer({ id:"sections-hi", type:"line", source:"sections",
      filter:["==",["get","CUSEC"],""],
      paint:{ "line-color":HIGHLIGHT.color, "line-width":HIGHLIGHT.width } }); // highlight above roads, deliberately

    let hoveredId = null;
    map.on("mousemove","sections-fill",(e)=>{
      // No cursor change — the hover outline is the affordance. A pointer/hand
      // cursor reads as "button" and fights the map's exploratory register.
      if(!e.features.length) return;
      const id = e.features[0].id;
      if(hoveredId===id) return;
      if(hoveredId!==null) map.setFeatureState({source:"sections",id:hoveredId},{hover:false});
      hoveredId = id;
      map.setFeatureState({source:"sections",id:hoveredId},{hover:true});
    });
    map.on("mouseleave","sections-fill",()=>{
      if(hoveredId!==null) map.setFeatureState({source:"sections",id:hoveredId},{hover:false});
      hoveredId = null;
    });
    map.on("click",(e)=>{
      const hit = map.queryRenderedFeatures(e.point,{layers:["sections-fill"]});
      if(hit.length) openSection(hit[0].properties);
      else closePanel();
    });

    renderLegend();
    hideToast();
  }catch(e){
    showToast(I18N[lang].error,true);
    console.error(e);
  }
});

/* ---------- SHARED: detail slot (in-rail on desktop, bottom-sheet on mobile) ---------- */
const rail = document.querySelector(".rail");
const detail = document.getElementById("detail");
const detailInner = document.getElementById("detail-inner");
function openSection(props){
  selectedCUSEC = props.CUSEC;
  map.setFilter("sections-hi",["==",["get","CUSEC"],selectedCUSEC]);
  refreshPanel();
  rail.classList.add("has-detail");
}
function refreshPanel(){
  if(!selectedCUSEC || !feats) return;
  const f = feats.find(x=>x.properties.CUSEC===selectedCUSEC);
  if(!f) return;
  const t = I18N[lang], v = varByKey(activeKey);
  const raw = f.properties[activeKey];
  const hasValue = (typeof raw === "number");
  const val = fmtValue(raw, v.unit);
  const d = selectedCUSEC.slice(5,7), s = selectedCUSEC.slice(7,10);
  detailInner.innerHTML =
    `<button class="detail__back" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>${t.rail}</button>
     <button class="detail__close" aria-label="\u00d7">&times;</button>
     <h3 class="panel__title">${t.section} ${s}</h3>
     <p class="panel__subtitle">${t.district} ${d} \u00b7 CUSEC ${selectedCUSEC}</p>
     <div class="panel__field">
       <p class="panel__field-label">${v.name[lang]} \u00b7 2023</p>
       <p class="panel__field-value big">${hasValue ? val : "\u2014"}</p>
     </div>
     ${hasValue ? "" : `<p class="panel__field-value" style="color:var(--muted)">${t.suppressed}</p>`}
     <p class="panel__note">${v.gloss[lang]}</p>`;
  detailInner.querySelector(".detail__close").addEventListener("click", closePanel);
  detailInner.querySelector(".detail__back").addEventListener("click", closePanel);
}
function closePanel(){
  rail.classList.remove("has-detail");
  selectedCUSEC = null;
  if(map.getLayer("sections-hi")) map.setFilter("sections-hi",["==",["get","CUSEC"],""]);
}
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closePanel(); });

document.getElementById("langs").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.lang;
  try{ localStorage.setItem(STORAGE_KEY,lang); }catch(err){}
  applyText(); syncURL();
});

applyText();
showToast(I18N[lang].loading,false);
</script>
